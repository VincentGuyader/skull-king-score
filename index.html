<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0d151d; --surface:#16202b; --surface-2:#1e2b38; --surface-3:#26374a;
  --line:rgba(255,255,255,.10); --ink:#fff; --ink-2:#c3c2b7; --muted:#8b95a1;
  --gold:#e0b567; --gold-dim:#8a6b2f; --danger:#d03b3b; --good:#0ca30c; --warn:#fab219;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --r:14px; --tap:46px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.4; overscroll-behavior-y:contain;
}
#shell{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:linear-gradient(180deg,var(--bg) 70%,rgba(13,21,29,0));
  display:flex;align-items:center;gap:10px;
}
header .ttl{flex:1;min-width:0}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center;font-size:17px;cursor:pointer;
}
.iconbtn:active{background:var(--surface-2)}
main{flex:1;padding:0 14px 140px}
/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 10px;font-weight:600}
h2:first-child{margin-top:6px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:16px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;border-radius:14px;border:0;background:var(--gold);color:#1a1206;
  font-weight:700;font-size:16.5px;cursor:pointer;padding:0 16px;
}
.btn:active{filter:brightness(.92)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(208,59,59,.4);font-weight:600}
.btn.sm{min-height:44px;font-size:14.5px;border-radius:11px}
input[type=text]{
  width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 12px;font-size:16px;font-family:inherit;min-height:var(--tap);
}
input[type=text]:focus{outline:2px solid var(--gold-dim);outline-offset:0}
/* ---------- bottom bar ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:10px 14px calc(var(--safe-b) + 10px);
  background:linear-gradient(180deg,rgba(13,21,29,0),var(--bg) 32%);
  backdrop-filter:blur(6px);
}
#bar .inner{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#bar .hint{text-align:center;font-size:12.5px;color:var(--muted);min-height:16px}
#bar .hint.warn{color:var(--warn)}
/* ---------- chips (bid / tricks) ---------- */
.plr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 12px;margin-bottom:10px}
.plr.done{border-color:rgba(224,181,103,.28)}
.plr .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.nm{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.gold{background:rgba(224,181,103,.15);color:var(--gold)}
.badge.pts{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  min-width:var(--tap);height:var(--tap);padding:0 6px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font-size:17px;font-weight:650;cursor:pointer;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;flex:1 1 auto;
}
.chip:active{background:var(--surface-3)}
.chip.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:800}
.chip.zero.on{background:var(--gold);border-color:var(--gold)}
.bonusbtn{
  margin-top:9px;width:100%;min-height:40px;border-radius:11px;border:1px dashed var(--line);
  background:transparent;color:var(--muted);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.bonusbtn.on{border-style:solid;border-color:rgba(224,181,103,.45);color:var(--gold);background:rgba(224,181,103,.08)}
/* ---------- ligne joueur compacte (compteur +/-) ---------- */
.pr{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;margin-bottom:9px}
.pr.unset{border-style:dashed;border-color:rgba(255,255,255,.16)}
.pr.set{border-color:rgba(224,181,103,.30)}
.pr .sub2{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.35}
.pr .sub2 b{color:var(--gold);font-weight:600}
.pr .sub2 .mise{border-bottom:1px dotted var(--muted);cursor:pointer}
.pr .sub2 .mise.moved{color:var(--gold);border-color:var(--gold)}
.pr .sub2 .mise i{font-style:normal;opacity:.75}
.pgrid{display:grid;grid-template-columns:1fr;gap:7px;margin:6px 0}
.pchip{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left}
.pchip.on{border-color:var(--gold);background:rgba(224,181,103,.12)}
.pchip .pn{font-weight:650;font-size:14.5px;color:var(--ink);display:block;margin-bottom:1px}
.pchip .pp{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.pchip .pk{width:26px;flex:0 0 26px;text-align:center;font-size:17px}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 2px}
.star{
  width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--muted);font-size:17px;cursor:pointer;display:grid;place-items:center;
}
.star.on{border-color:rgba(224,181,103,.5);color:var(--gold);background:rgba(224,181,103,.10)}
.step.big{gap:5px}
.step.big button{width:48px;height:48px;border-radius:13px;font-size:24px;font-weight:600;background:var(--surface-2)}
.step.big button:active{background:var(--surface-3)}
.step.big .v{min-width:40px;font-size:24px;font-weight:800}
.step.big .v.none{color:var(--muted);font-weight:600}
.step.big .v.on{color:var(--gold)}
/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,12,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:86vh;overflow:auto;
  background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:8px 14px calc(var(--safe-b) + 16px);transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
}
.sheet.open{transform:none}
@media(min-width:521px){.sheet{max-width:520px;margin:0 auto}}

/* Mentions : repliees par defaut, atteignables au clavier comme au doigt.
   On les trouve quand on les cherche, elles n'encombrent personne sinon. */
.about{margin:18px 2px 0;border-top:1px solid var(--line);padding-top:12px}
.about summary{
  font-size:12.5px;color:var(--muted);cursor:pointer;list-style:none;
  padding:8px 2px;min-height:44px;display:flex;align-items:center;gap:6px;
}
.about summary::-webkit-details-marker{display:none}
.about summary::before{content:'›';display:inline-block;transition:transform .15s}
.about[open] summary::before{transform:rotate(90deg)}
.about p{font-size:12.5px;line-height:1.6;color:var(--muted);margin:2px 2px 10px}
.about a{color:var(--ink-2)}

/* Ligne joueur sur petit ecran. Le nom dit a qui on attribue les plis :
   c'est la derniere chose qui doit ceder. Sous 412 px, l'avatar, l'etoile
   et le compteur se resserrent pour lui laisser la place, et le compteur
   reste au-dessus de la cible tactile confortable. */
/* Sur la ligne joueur, le nom ne doit jamais etre coupe : c'est
   l'information qui dit a qui on attribue les plis. Il passe a la ligne
   plutot que de se faire tronquer, quelle que soit la police du systeme.
   Le resserrement ci-dessous fait que ce repli sert rarement. */
#rows .pr .nm{
  white-space:normal;overflow:visible;text-overflow:clip;
  overflow-wrap:anywhere;line-height:1.25;
}
@media(max-width:411px){
  .nm{font-size:14.5px}
  .pr{gap:7px;padding:7px}
  .pr .av{width:30px;height:30px;flex:0 0 30px;font-size:16px}
  .pr .sub2{font-size:12px}
  .star{width:36px;height:36px;flex:0 0 36px;font-size:16px}
  .step.big{gap:4px}
  .step.big button{width:40px;height:40px;border-radius:11px;font-size:20px}
  .step.big .v{min-width:28px;font-size:20px}
}
@media(max-width:359px){
  .nm{font-size:13.5px}
  .pr{gap:5px;padding:6px}
  .pr .av{width:26px;height:26px;flex:0 0 26px;font-size:14px}
  .pr .sub2{font-size:11.5px}
  .star{width:36px;height:36px;flex:0 0 36px}
  .step.big{gap:3px}
  .step.big button{width:37px;height:37px;font-size:19px}
  .step.big .v{min-width:24px;font-size:19px}
}
.grab{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:6px auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px}
.brow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.brow:last-of-type{border-bottom:0}
.brow .lbl{flex:1;min-width:0;font-size:15px}
.brow .lbl small{display:block;color:var(--muted);font-size:12.5px}
.step{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.step button{
  width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;
}
.step button:disabled{opacity:.32}
.step .v{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sw{width:52px;height:31px;border-radius:999px;background:var(--surface-3);position:relative;flex:0 0 52px;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--gold)}
.sw.on::after{transform:translateX(21px)}
/* ---------- raccourcis de points ---------- */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 4px}
.qbtn{
  min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;
}
.qbtn:active{background:var(--surface-3)}
.qbtn.minus{color:#e88}
.bigval{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;padding:6px 0;color:var(--gold)}
.bigval.z{color:var(--muted)}
.rule{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .lbl{flex:1;min-width:0}
.rule .lbl small{display:block;color:var(--muted);font-size:12.5px}
.mini{width:44px;height:44px;flex:0 0 44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:15px;cursor:pointer;display:grid;place-items:center}
/* ---------- tuiles de statistiques ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;text-align:center}
.tile .tv{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.tile .tl{font-size:11px;color:var(--muted);margin-top:2px}
.lead .sub2{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- avatars, couleurs, pictos ---------- */
.av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;font-size:19px;border:2px solid var(--line);line-height:1}
.av.sm{width:28px;height:28px;flex:0 0 28px;font-size:15px;border-width:2px}
.av.big{width:84px;height:84px;flex:0 0 84px;font-size:44px;border-width:3px;margin:2px auto 12px}
.cgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:6px 0}
.cb{height:40px;border-radius:11px;border:3px solid transparent;cursor:pointer;padding:0}
.cb.on{border-color:#fff}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:236px;overflow:auto;padding:2px;-webkit-overflow-scrolling:touch}
.eb{height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:23px;cursor:pointer;display:grid;place-items:center;line-height:1}
.eb.on{border-color:var(--gold);background:rgba(224,181,103,.16)}
input[type=color]{width:52px;height:46px;flex:0 0 52px;padding:2px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);cursor:pointer}
/* ---------- scores ---------- */
.lead{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.lead.first{border-color:rgba(224,181,103,.45);background:linear-gradient(180deg,rgba(224,181,103,.10),var(--surface))}
.rank{width:26px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lead.first .rank{color:var(--gold)}
.tot{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.delta.pos{color:var(--good)} .delta.neg{color:var(--danger)} .delta.zero{color:var(--muted)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:600}
thead th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
tbody tr:last-child td{border-bottom:0}
td.neg{color:var(--danger)}
tfoot td{font-weight:800;background:var(--surface-2)}
/* ---------- chart ---------- */
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 6px 2px}
.lg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.lg i{width:11px;height:11px;border-radius:3px;display:block}
/* ---------- help ---------- */
.hier{display:flex;flex-direction:column;gap:6px}
.hier div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:14px;display:flex;gap:9px;align-items:center}
.hier div>span{min-width:0;overflow-wrap:anywhere}
.hier b{color:var(--gold);font-size:12px;width:16px;text-align:center}
/* Deux colonnes tant que ca tient, l'une sous l'autre sinon. Les libelles
   de regles sont longs, surtout en allemand : sans repli, la ligne sortait
   de sa carte et toute la page prenait un defilement horizontal. */
.kv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv>span{min-width:0;overflow-wrap:anywhere}
.kv span:last-child{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto;text-align:right}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;color:var(--ink-2);border-radius:9px;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1206}
.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,14px);z-index:70;
  background:var(--surface-3);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:14px;
  opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<body>
<div id="shell">
  <header>
    <button class="iconbtn" id="hBack" style="display:none">‹</button>
    <div class="ttl"><h1 id="hTitle">Skull King</h1><div class="sub" id="hSub"></div></div>
    <button class="iconbtn" id="hHelp" title="Aide">?</button>
    <button class="iconbtn" id="hMenu" title="Menu">⋯</button>
  </header>
  <main id="app"></main>
</div>
<div id="bar"><div class="inner"><div class="hint" id="barHint"></div><div id="barBtns"></div></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/*ENGINE_START*/
/* ===== Moteur de score Skull King : pur, testable ===================== */
const DECK = {base:70, loot:2, kraken:1, whale:1}; // 56 couleurs + 5 fuites + 5 pirates + tigresse + SK + 2 sirènes

const PIRATES = [
  {k:'rosie',   nom:"Rosie D'Laney",   pouvoir:"Désigne qui entame le pli suivant, elle-même comprise"},
  {k:'bendt',   nom:"Bendt le Bandit", pouvoir:"Pioche 2 cartes du talon, puis en défausse 2"},
  {k:'rascal',  nom:"Rascal de Roatán",pouvoir:"Parie 0, 10 ou 20 points sur sa propre annonce"},
  {k:'juanita', nom:"Juanita Jade",    pouvoir:"Consulte en secret les cartes non distribuées"},
  {k:'harry',   nom:"Harry le Géant",  pouvoir:"Modifie son annonce de +1, -1, ou la laisse"}
];

const BONUS_DEFS = [
  {k:'c14',   pts:10, max:3, i:'b14'},
  {k:'b14',   pts:20, max:1, i:'bb14'},
  {k:'mByP',  pts:20, max:2, i:'bmp'},
  {k:'pBySK', pts:30, max:5, i:'bpsk'},
  {k:'skByM', pts:40, max:1, i:'bskm'},
  {k:'loot',  pts:20, max:2, i:'bloot', need:'loot'},
  {k:'free',  pts:1,  max:0, i:'bfree', free:true}
];

function deckSize(cfg){
  return DECK.base + (cfg.loot?DECK.loot:0) + (cfg.kraken?DECK.kraken:0) + (cfg.whale?DECK.whale:0);
}
function maxCards(cfg, nPlayers){ return Math.floor(deckSize(cfg)/Math.max(2,nPlayers)); }
function cardsForRound(cfg, nPlayers, roundIdx){ // roundIdx 0-based
  return Math.min(roundIdx+1, maxCards(cfg,nPlayers));
}
/* Sépare les bonus en deux poches :
   cond = soumis à la réussite de l'annonce (bonus officiels, règles maison "soumises")
   free = toujours acquis (points libres, règles maison "toujours comptées") */
function bonusSplit(b, cfg){
  let cond = 0, free = 0;
  if(!b) return {cond, free};
  for(const d of BONUS_DEFS){
    const v = b[d.k]||0; if(!v) continue;
    if(d.free) free += v; else cond += v*d.pts;
  }
  ((cfg && cfg.custom) || []).forEach(c=>{
    const v = b['x'+c.id]||0; if(!v) return;
    if(c.cond === 'bid') cond += v*c.pts; else free += v*c.pts;
  });
  return {cond, free};
}
function bonusPoints(b, cfg){ const s = bonusSplit(b, cfg); return s.cond + s.free; }
/* Nombre de plis attribuables dans une manche.
   Certaines cartes maison comptent pour plusieurs plis : chaque exemplaire saisi
   augmente la capacité de la manche, ce qui garde le détrompeur utilisable. */
function roundCapacity(game, ri){
  const cards = cardsForRound(game.cfg, game.players.length, ri);
  const r = game.rounds[ri];
  let extra = r.extra || 0;
  ((game.cfg && game.cfg.custom) || []).forEach(c=>{
    if(!c.tricks) return;
    game.players.forEach(p=>{ extra += ((r.bonus[p.id]||{})['x'+c.id]||0) * c.tricks; });
  });
  return {cards, extra, cap: cards + extra};
}
/* Barème d'une manche pour un joueur.
   bid: annonce, tricks: plis réalisés, cards: cartes distribuées,
   bp: bonus soumis à l'annonce, bpFree: ajustements toujours acquis */
function scoreRound(bid, tricks, cards, bp, cfg, bpFree, wager){
  const diff = Math.abs(bid - tricks), exact = diff === 0;
  let base = 0, bonus = 0;
  if(cfg.scoring === 'rascal'){
    const pot = (cfg.rascal === 'cannonball' ? 15 : 10) * cards;
    if(cfg.rascal === 'cannonball'){
      base = exact ? pot : 0;  bonus = exact ? bp : 0;
    } else {
      if(exact){ base = pot; bonus = bp; }
      else if(diff === 1){ base = Math.round(pot/2); bonus = Math.round(bp/2); }
      else { base = 0; bonus = 0; }
    }
  } else { // classique
    if(bid === 0) base = exact ? 10*cards : -10*cards;
    else          base = exact ? 20*tricks : -10*diff;
    bonus = (exact || !cfg.bonusIfExact) ? bp : 0;
  }
  const adj = bpFree||0;
  /* Pari du Rascal de Roatán : gagné si l'annonce est juste, perdu sinon */
  const w = wager||0, bet = w ? (exact ? w : -w) : 0;
  return {base, bonus, adj, bet, total: base+bonus+adj+bet, exact, diff};
}
/* Détail complet d'une manche jouée -> {pid: {base,bonus,total,...}} */
function scoreRoundAll(game, ri){
  const r = game.rounds[ri], cards = cardsForRound(game.cfg, game.players.length, ri), out = {};
  for(const p of game.players){
    const bid = r.bids[p.id], tr = r.tricks[p.id], bo = r.bonus[p.id]||{}, sp = bonusSplit(bo, game.cfg);
    out[p.id] = (bid==null||tr==null) ? {base:0,bonus:0,adj:0,bet:0,total:0,exact:false,diff:0}
              : scoreRound(bid, tr, cards, sp.cond, game.cfg, sp.free, bo.wager);
  }
  return out;
}
/* Cumuls après chaque manche jouée -> {pid:[c1,c2,...]} + totaux */
function standings(game){
  /* idx : indice reel de chaque manche empilee. Une manche rouverte au
     milieu de la partie cree un trou ; sans cette liste, les colonnes du
     tableau et l'abscisse de la courbe se decalent silencieusement. */
  const cum = {}, per = {}, idx = [];
  game.players.forEach(p=>{cum[p.id]=[];per[p.id]=[]});
  let run = {}; game.players.forEach(p=>run[p.id]=0);
  game.rounds.forEach((r,ri)=>{
    if(!r.locked) return;
    idx.push(ri);
    const sc = scoreRoundAll(game, ri);
    game.players.forEach(p=>{ run[p.id]+=sc[p.id].total; per[p.id].push(sc[p.id]); cum[p.id].push(run[p.id]); });
  });
  const tot = game.players.map(p=>({p, total:run[p.id], last: per[p.id].length?per[p.id][per[p.id].length-1].total:0}));
  tot.sort((a,b)=>b.total-a.total);
  /* Une partie sans joueur n'a pas de manche jouée : le dire plutôt que de
     lire l'identifiant d'un premier joueur qui n'existe pas. */
  return {cum, per, tot, idx, played: game.players.length ? cum[game.players[0].id].length : 0};
}
/* Rangs d'un classement déjà trié : deux totaux égaux occupent le même rang,
   et le rang suivant saute d'autant. Une égalité parfaite n'a pas de
   vainqueur, l'ordre du tableau players n'a pas à en désigner un. */
function ranks(tot){
  return tot.map(t=>1 + tot.filter(x=>x.total > t.total).length);
}
/* Joueurs en tête : un seul le plus souvent, plusieurs à égalité. */
function leaders(tot){
  return tot.length ? tot.filter(t=>t.total === tot[0].total) : [];
}
/* ===== Archive : résultat d'une partie ============================== */
/* Une partie archivée a la même forme qu'une partie en cours.
   Une partie saisie à la main porte manual:true et finals:{pid:score}. */
function gameResult(g){
  if(g.manual){
    const tot=g.players.map(p=>({id:p.id, name:p.name, total:(g.finals||{})[p.id]||0}));
    tot.sort((a,b)=>b.total-a.total);
    return {tot, manual:true, played:0, st:null};
  }
  const st=standings(g);
  return {tot: st.tot.map(t=>({id:t.p.id, name:t.p.name, total:t.total})), manual:false, played:st.played, st};
}
function emptyStat(){
  return {games:0, wins:0, podiums:0, sum:0, best:null, worst:null,
          rounds:0, exact:0, zeroTry:0, zeroOk:0, bestRound:null, bonus:0, skByM:0,
          streak:0, cur:0, margin:0, detailed:0, powers:0, pir:{}, wagerNet:0, wagerCount:0};
}
/* Agrège une liste de parties -> statistiques par joueur + face à face */
function computeStats(games){
  const S={}, H={};
  const get=id=>S[id]||(S[id]=emptyStat());
  const sorted=games.slice().sort((a,b)=>(a.date||0)-(b.date||0));
  sorted.forEach(g=>{
    const r=gameResult(g);
    if(!r.tot.length) return;
    const rangs=ranks(r.tot);
    r.tot.forEach((t,i)=>{
      const s=get(t.id);
      s.games++; s.sum+=t.total;
      s.best = s.best==null?t.total:Math.max(s.best,t.total);
      s.worst= s.worst==null?t.total:Math.min(s.worst,t.total);
      /* Une égalité en tête est une victoire pour chacun des ex aequo. */
      if(t.total===r.tot[0].total){
        s.wins++; s.cur++; s.streak=Math.max(s.streak,s.cur);
        if(r.tot[1]) s.margin=Math.max(s.margin, t.total-r.tot[1].total);
      } else s.cur=0;
      /* Un podium existe des qu'on classe : a trois joueurs il y a bien un
         premier, un deuxieme et un troisieme. Le rang tient compte des ex
         aequo, donc quatre joueurs a egalite au rang 2 y sont tous. */
      if(rangs[i]<=3) s.podiums++;
      r.tot.forEach((u,j)=>{
        if(u.id===t.id) return;
        const k=t.id+'|'+u.id;
        H[k]=H[k]||{w:0,n:0};
        H[k].n++; if(t.total > u.total) H[k].w++;
      });
    });
    if(!r.manual && r.st){
      g.players.forEach(p=>{
        const s=get(p.id); s.detailed++;
        g.rounds.forEach(rd=>{
          if(!rd.locked) return;
          const bid=rd.bids[p.id]||0, tr=rd.tricks[p.id]||0, bo=rd.bonus[p.id]||{};
          s.rounds++;
          if(bid===tr) s.exact++;
          if(bid===0){ s.zeroTry++; if(tr===0) s.zeroOk++; }
          s.bonus += bonusPoints(bo, g.cfg);
          s.skByM += bo.skByM||0;
          (bo.pir||[]).forEach(k=>{ s.powers++; s.pir[k]=(s.pir[k]||0)+1; });
          if(bo.wager){ s.wagerCount++; s.wagerNet += (bid===tr ? bo.wager : -bo.wager); }
        });
        (r.st.per[p.id]||[]).forEach(x=>{ s.bestRound = s.bestRound==null?x.total:Math.max(s.bestRound,x.total); });
      });
    }
  });
  Object.values(S).forEach(s=>{ s.avg = s.games? Math.round(s.sum/s.games) : 0; delete s.cur; });
  return {S, H};
}
/* Classement du hall of fame : victoires, puis moyenne par partie */
function hofRank(stats, names){
  return Object.keys(stats).map(id=>Object.assign({id, name:names[id]||'?'}, stats[id]))
    .sort((a,b)=> b.wins-a.wins || b.avg-a.avg || b.games-a.games);
}
/* Filtre de périmètre : barème, nombre de joueurs, ancienneté (en mois) */
function filterGames(games, f){
  return games.filter(g=>{
    if(f.scoring && f.scoring!=='all' && (g.cfg?g.cfg.scoring:'classic')!==f.scoring) return false;
    if(f.size && f.size!=='all'){
      const n=g.players.length;
      if(f.size==='2-3' && n>3) return false;
      if(f.size==='4-5' && (n<4||n>5)) return false;
      if(f.size==='6+' && n<6) return false;
    }
    if(f.months && f.months!=='all' && f.now){
      const age = f.now - (g.date||0);
      /* Une date dans le futur donne une anciennete negative, qui passait
         toutes les bornes. Un jour de marge absorbe les fuseaux et une
         saisie du soir. */
      if(age > f.months*30.44*864e5 || age < -864e5) return false;
    }
    return true;
  });
}
/* ===== Couleurs : lisibilité et distinction ========================== */
const SURFACE='#16202b';               // fond des cartes, référence de contraste
const SERIES_HEX=['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
const PICTOS=['☠️','💀','🏴‍☠️','⚓','🚢','⛵','🛶','🗡️','⚔️','🔱','🪝','🧭','🗺️','💰','💎','👑','🪙','🍺','🥃','🍻',
              '🦜','🐙','🦑','🦈','🐋','🐬','🐠','🦀','🦞','🐚','🪸','🏝️','🌴','🥥','🌊','🌀','⛈️','⚡','🔥','🕯️',
              '🔭','⏳','🧿','🎣','⛓️','🦴','👻','🌙','⭐','🧜'];

function hex2rgb(h){
  h=String(h||'').replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h.slice(0,6),16);
  return [ (n>>16)&255, (n>>8)&255, n&255 ];
}
function rgb2hex(r,g,b){
  const c=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+c(r)+c(g)+c(b);
}
function lin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function luminance(hex){ const [r,g,b]=hex2rgb(hex).map(lin); return 0.2126*r+0.7152*g+0.0722*b; }
function contrast(a,b){
  const l1=luminance(a), l2=luminance(b);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
function toOklab(hex){
  const [R,G,B]=hex2rgb(hex).map(lin);
  const l=Math.cbrt(0.4122214708*R+0.5363325363*G+0.0514459929*B);
  const m=Math.cbrt(0.2119034982*R+0.6806995451*G+0.1073969566*B);
  const s=Math.cbrt(0.0883024619*R+0.2817188376*G+0.6299787005*B);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,
          1.9779984951*l-2.4285922050*m+0.4505937099*s,
          0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
/* Écart perceptuel entre deux couleurs, échelle OKLab x100 : sous 15, deux
   courbes voisines deviennent difficiles à distinguer. */
function deltaE(a,b){
  const A=toOklab(a), B=toOklab(b);
  return Math.sqrt((A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2)*100;
}
/* Éclaircit une couleur trop sombre jusqu'à atteindre 3:1 sur le fond sombre */
function ensureReadable(hex, surface){
  surface=surface||SURFACE;
  let [r,g,b]=hex2rgb(hex);
  let out=rgb2hex(r,g,b), n=0;
  while(contrast(out, surface)<3 && n<40){
    r=r+(255-r)*0.08; g=g+(255-g)*0.08; b=b+(255-b)*0.08;
    out=rgb2hex(r,g,b); n++;
  }
  return {color:out, adjusted:n>0};
}
/* Paires trop proches parmi une liste de {id,name,color} */
function closePairs(players, seuil){
  seuil=seuil||15; const out=[];
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    if(deltaE(players[i].color, players[j].color) < seuil) out.push([players[i], players[j]]);
  }
  return out;
}

/* ===== Stockage sûr (localStorage si dispo, sinon mémoire) ============ */
const Store = (()=>{ let mem={};
  const ok = (()=>{ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true;}catch(e){return false;} })();
  return {
    get(k,d){ try{ const v = ok?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){
      try{ const s=JSON.stringify(v); if(ok) localStorage.setItem(k,s); else mem[k]=s; return true; }
      catch(e){ noteStorageFailure(); return false; }
    },
    del(k){ try{ if(ok) localStorage.removeItem(k); else delete mem[k]; }catch(e){} }
  };
})();

/* Stockage sature en pleine partie. L'ancienne version avalait l'exception :
   la partie continuait a l'ecran, plus rien n'etait enregistre, et le joueur
   ne decouvrait la perte qu'au rechargement suivant. */
let storageDown = false;
function noteStorageFailure(){
  if(storageDown) return;
  storageDown = true;
  try{ paintStorage(); }catch(e){}
}

/* ===== Robustesse des données ========================================
   Le stockage est un fichier texte que n'importe quoi peut abîmer : une
   version future, un import raté, une extension, une main humaine. Rien de
   ce qui en sort n'est cru sur parole. */
function asList(v){ return Array.isArray(v) ? v : []; }
/* Une fiche exploitable : un identifiant stable, c'est tout ce dont
   l'affichage a besoin pour retrouver couleur, picto et nom. */
function validEntry(p){ return !!p && typeof p==='object' && typeof p.id==='string' && !!p.id; }
/* Une partie exploitable : des joueurs identifiés, des manches lisibles.
   Sans ces garanties, l'écran des scores et le hall of fame lèvent. */
function validGame(g){
  if(!g || typeof g!=='object' || Array.isArray(g)) return false;
  if(!Array.isArray(g.players) || !g.players.length) return false;
  if(!g.players.every(validEntry)) return false;
  if(g.rounds!=null && !Array.isArray(g.rounds)) return false;
  return true;
}
/* Configuration toujours utilisable : les règles maison sont parcourues à
   chaque rendu, une valeur d'un autre type emportait tout l'écran. */
function safeCfg(cfg){
  const c = (cfg && typeof cfg==='object' && !Array.isArray(cfg)) ? cfg : {};
  if(!Array.isArray(c.custom)) c.custom = [];
  return c;
}

let LANG = 'fr', T = I18N.fr;
function detectLang(){
  const saved = Store.get('sk_lang', null);
  if(saved && I18N[saved]) return saved;
  const cands = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||'en']);
  for(const c of cands){
    const k = String(c).slice(0,2).toLowerCase();
    if(I18N[k]) return k;
  }
  return 'en';
}
function setLang(k, persist){

}

const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const DEFAULT_CFG = {scoring:'classic', rascal:'grapeshot', bonusIfExact:true, loot:true, kraken:true, whale:true, pirates:true, rounds:10, custom:[]};
let G = null;            // partie en cours
let view = 'setup';      // setup | round | scores | help
let draft = null;        // écran de configuration
let param = null;        // paramètre de l'écran courant (id de joueur, de partie...)
let backStack = [];      // pile de navigation
/* Il n'y a qu'une clé sk_game pour tous les onglets. Chaque écriture signe
   son auteur ; un onglet qui voit passer la signature d'un autre sait que sa
   partie en mémoire n'est plus celle qui est enregistrée, et arrête
   d'écrire au lieu de l'écraser. */
const TAB = 't' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
let stale = false;
/* La pile en memoire fait foi, l'historique du navigateur sert de
   declencheur. Sans entree d'historique, le bouton precedent et le geste de
   retour d'Android quittaient l'application au lieu de reculer d'un ecran. */
function go(v,pa){
  backStack.push({v:view,p:param}); view=v; param=pa||null;
  try{ history.pushState({sk:backStack.length}, ''); }catch(e){}
  render();
}
function popBack(){ const s=backStack.pop(); view=s?s.v:'scores'; param=s?s.p:null; render(); }
function goBack(){
  if(!backStack.length) return;
  /* Deleguer au navigateur quand une entree nous appartient : c'est lui qui
     rappellera popBack, et les deux piles restent alignees. */
  if(history.state && history.state.sk) history.back(); else popBack();
}
window.addEventListener('popstate', ()=>{ if(backStack.length) popBack(); });
function goRoot(v,pa){ backStack=[]; view=v; param=pa||null; render(); }
const $ = s=>document.querySelector(s);

/* ===== Répertoire de joueurs et archive des parties =================== */
function uid(pfx){ return (pfx||'') + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function roster(){ return asList(Store.get('sk_roster', [])).filter(validEntry); }
function saveRoster(l){ Store.set('sk_roster', l); refreshRMap(); }
function rosterName(id){ const p=roster().find(x=>x.id===id); return p?p.name:null; }
/* Cache du répertoire : la couleur et le picto affichés viennent toujours de la
   fiche à jour, même pour une partie archivée il y a six mois. */
let RMAP={};
function refreshRMap(){ RMAP={}; roster().forEach(p=>RMAP[p.id]=p); }
function pcol(p,i){
  const r=p&&RMAP[p.id];
  if(r&&r.color) return r.color;
  if(p&&p.color) return p.color;
  if(p&&p.c){ const k=SERIES.indexOf(p.c); if(k>=0) return SERIES_HEX[k]; }
  return SERIES_HEX[(i||0)%8];
}
function pico(p){ const r=p&&RMAP[p.id]; return (r&&r.icon) || (p&&p.icon) || '☠️'; }
function avatar(p,i,cls){
  const c=pcol(p,i);
  return `<div class="av ${cls||''}" style="border-color:${c};background:${c}22">${pico(p)}</div>`;
}
function freeColor(){
  const used=roster().map(p=>p.color);
  return SERIES_HEX.find(c=>!used.includes(c)) || SERIES_HEX[used.length%8];
}
function freeIcon(){
  const used=roster().map(p=>p.icon);
  return PICTOS.find(c=>!used.includes(c)) || PICTOS[used.length%PICTOS.length];
}
/* Une entree inexploitable est ignoree plutot que subie : elle faisait
   echouer computeStats et gameResult, et emportait tout le hall of fame. */
function archive(){ return asList(Store.get('sk_archive', [])).filter(validGame); }
function saveArchive(l){ Store.set('sk_archive', l); }
function archiveUpsert(g){
  const l=archive(), i=l.findIndex(x=>x.id===g.id);
  const rec={id:g.id, date:g.date||g.started||Date.now(), cfg:g.cfg, players:g.players,
             rounds:g.rounds, manual:!!g.manual, finals:g.finals};
  if(i>=0) l[i]=rec; else l.push(rec);
  saveArchive(l);
}
/* Noms d'affichage : le répertoire fait foi, sinon le nom figé dans la partie */
function allNames(){
  const n={};
  archive().forEach(g=>g.players.forEach(p=>{ n[p.id]=p.name; }));
  roster().forEach(p=>{ n[p.id]=p.name; });
  return n;
}

function newDraft(){
  let sel = asList(Store.get('sk_lastsel', []));
  const ids = roster().map(p=>p.id);
  sel = sel.filter(id=>ids.includes(id));
  return {sel, cfg:safeCfg(Object.assign({}, DEFAULT_CFG, safeCfg(Store.get('sk_cfg', {}))))};
}
function startGame(){
  Store.set('sk_lastsel', draft.sel); Store.set('sk_cfg', draft.cfg);
  G = {
    id: uid('g'),
    players: draft.sel.map((id,i)=>{ const r=roster().find(x=>x.id===id)||{};
      return {id, name:r.name||('Joueur '+(i+1)), color:r.color||SERIES_HEX[i%8], icon:r.icon||'☠️'}; }),
    cfg: Object.assign({}, draft.cfg),
    rounds: Array.from({length:draft.cfg.rounds},()=>({bids:{},tricks:{},bonus:{},locked:false})),
    cur:0, phase:'bid', started:Date.now()
  };
  save(); goRoot('round');
}
function save(){
  if(stale) return;   // la partie enregistrée appartient à un autre onglet
  Store.set('sk_game', G);
  Store.set('sk_owner', TAB);
  if(G && G.rounds.every(r=>r.locked)) archiveUpsert(G);
}
/* Une partie illisible est ignorée plutôt que subie : l'application repart
   sur l'écran de configuration au lieu de rester blanche à chaque
   chargement, sans moyen d'en sortir depuis l'application. */
function load(){
  const g = Store.get('sk_game', null);
  if(!validGame(g) || !Array.isArray(g.rounds) || !g.rounds.length) return;
  g.cfg = safeCfg(g.cfg);
  G = g;
}

/* ===== Utilitaires UI ================================================ */
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms||8); }catch(e){} }
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function openSheet(html){ $('#sheetBody').innerHTML=''; $('#sheetBody').appendChild(h(html)); $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#scrim').onclick = closeSheet;
function sgn(n){ return (n>0?'+':'')+n; }

/* Garde l'écran allumé pendant la partie */
let wl=null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && !wl){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null}); }
    else if(!on && wl){ wl.release(); wl=null; }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && G && view==='round') keepAwake(true); });

/* Anti-rebond de navigation. Le bouton principal d'un écran occupe la place
   que le précédent vient de libérer : sans ce garde, un double appui sur
   « Valider la manche » enchaîne sur « Manche suivante » et personne ne voit
   les scores. Deux actions d'écran séparées de moins d'un tiers de seconde
   ne peuvent pas être délibérées ; la seconde est ignorée. */
let navAt = 0;
function freshTap(){
  const now = Date.now();
  if(now - navAt <= 320) return false;
  navAt = now;
  return true;
}
/* Toute interaction ailleurs que dans la barre du bas leve le garde : le
   joueur a repris la main, l'appui suivant est delibere. Seuls deux appuis
   consecutifs sur la barre, sans rien entre les deux, sont suspects. */
document.addEventListener('click', e=>{
  if(!e.target || !e.target.closest || !e.target.closest('#barBtns')) navAt = 0;
}, true);

/* Bannière de stockage saturé. Rien n'est plus enregistré : la seule chose
   utile à proposer est un export immédiat, avant de fermer l'onglet. */
function paintStorage(){
  const old = document.getElementById('storageBanner');
  if(old) old.remove();
  if(!storageDown) return;
  const app = $('#app');
  if(!app || !app.parentNode) return;
  const el = h(`<div class="card" id="storageBanner" style="border-color:rgba(240,80,70,.45);background:rgba(240,80,70,.08)">
    <div class="small" style="color:#ff7d74;margin-bottom:10px">${T.storageFull}</div>
    <button class="btn ghost sm" id="stgExp">${T.exportBtn}</button></div>`);
  app.parentNode.insertBefore(el.firstElementChild, app);
  const b = document.getElementById('stgExp');
  if(b) b.onclick = ()=>{ try{ doExport(); }catch(e){} };
}

/* Bannière d'onglet obsolète. Elle vit à côté de #app et non dedans, pour
   survivre aux repeints partiels de l'écran de manche. */
function paintStale(){
  const old = document.getElementById('staleBanner');
  if(old) old.remove();
  if(!stale) return;
  const app = $('#app');
  if(!app || !app.parentNode) return;
  const el = h(`<div class="card" id="staleBanner" style="border-color:rgba(250,178,25,.45);background:rgba(250,178,25,.07)">
    <div class="small" style="color:var(--warn);margin-bottom:10px">${T.otherTab}</div>
    <button class="btn ghost sm" id="stReload">${T.otherTabReload}</button></div>`);
  app.parentNode.insertBefore(el.firstElementChild, app);
  const b = document.getElementById('stReload');
  if(b) b.onclick = ()=>{ try{ location.reload(); }catch(e){} };
}
window.addEventListener('storage', e=>{
  if(e.key !== 'sk_owner' || !e.newValue) return;
  let who = null;
  try{ who = JSON.parse(e.newValue); }catch(err){ return; }
  if(who === TAB || stale) return;
  stale = true;
  paintStale();
});

/* ===== Rendu ========================================================= */
/* Filet de dernière chance. Les données sont assainies à la lecture, mais un
   écran qui casse pour une raison imprévue ne doit jamais laisser du blanc :
   il reste toujours de quoi récupérer sa sauvegarde et repartir. */
function render(){
  try{ renderView(); paintStale(); paintStorage(); }
  catch(err){ renderFailure(err); }
}
function renderFailure(err){
  try{ console.error('Skull King : écran en échec', err); }catch(e){}
  try{
    $('#hTitle').textContent = T.crashTitle;
    $('#hSub').textContent = '';
    $('#hBack').style.display = 'none';
    $('#barBtns').innerHTML = '';
    $('#barHint').textContent = '';
    const app=$('#app');
    app.innerHTML='';
    app.appendChild(h(`<div class="card">
      <div class="nm" style="margin-bottom:6px">${T.crashTitle}</div>
      <div class="small muted" style="margin-bottom:12px">${T.crashDesc}</div>
      <button class="btn ghost sm" id="crExp">${T.exportBtn}</button>
      <div style="height:8px"></div>
      <button class="btn danger" id="crNew">${T.crashReset}</button></div>`));
    $('#crExp').onclick=()=>{ try{ doExport(); }catch(e){} };
    $('#crNew').onclick=()=>{
      Store.del('sk_game'); G=null; draft=null; backStack=[]; param=null; view='setup'; render();
    };
  }catch(e){}
}
function renderView(){
  const app=$('#app'), bar=$('#barBtns'), hint=$('#barHint');
  app.innerHTML=''; bar.innerHTML=''; hint.textContent=''; hint.className='hint';
  hint.onclick=null; hint.style.cursor=''; refreshRMap();
  $('#hBack').style.display = backStack.length ? 'grid' : 'none';
  $('#hBack').setAttribute('aria-label', T.aBack);
  $('#hHelp').setAttribute('aria-label', T.helpTitle);
  $('#hMenu').setAttribute('aria-label', T.menu);
  if(view==='setup') renderSetup();
  else if(view==='round') renderRound();
  else if(view==='scores') renderScores();
  else if(view==='help') renderHelp();
  else if(view==='hof') renderHof();
  else if(view==='player') renderPlayer(param);
  else if(view==='game') renderGameDetail(param);
  else if(view==='roster') renderRoster();
  keepAwake(view==='round');
  window.scrollTo({top:0});
}

}

/* ---------- Règles maison ---------- */
/* Règles encore en jeu. Une règle retirée continue de compter dans les
   manches où elle a déjà été pointée, mais ne s'offre plus nulle part. */
function liveRules(cfg){ return ((cfg&&cfg.custom)||[]).filter(c=>c && !c.retired); }
/* Vrai si la règle a déjà rapporté ou coûté des points dans une manche
   validée de la partie en cours. La supprimer changerait alors un score
   déjà annoncé à la table. */
function ruleScored(cfg, c){
  if(!G || G.cfg!==cfg || !Array.isArray(G.rounds)) return false;
  return G.rounds.some(r=>r && r.locked &&
    G.players.some(p=>((r.bonus||{})[p.id]||{})['x'+c.id]));
}
function renderCustoms(cfg, box){
  if(!box) return;
  const list=cfg.custom||(cfg.custom=[]);
  box.innerHTML='';
  if(!liveRules(cfg).length){
    box.appendChild(h(`<div class="small muted">${T.noHouse}</div>`));
    return;
  }
  list.forEach((c,i)=>{
    if(c.retired) return;
    const row=h(`<div class="rule">
      <div class="lbl"><div>${esc(c.name)}</div><small>${sgn(c.pts)} pts${c.tricks?' · '+T.ruleTricksTag(c.tricks):''} · ${T.ruleMaxTag(c.max)} · ${c.cond==='bid'?T.ruleTagOn:T.ruleTagOff}</small></div>
      <button class="mini ed" aria-label="${esc(T.aEdit + ' ' + c.name)}">✎</button><button class="mini rm" aria-label="${esc(T.aRemove + ' ' + c.name)}">×</button></div>`);
    row.querySelector('.ed').onclick=()=>ruleSheet(cfg, i, ()=>renderCustoms(cfg, box));
    row.querySelector('.rm').onclick=()=>{
      /* Jamais pointée : on l'efface. Déjà pointée dans une manche validée :
         on la retire du jeu sans toucher aux points déjà annoncés. */
      if(ruleScored(cfg, c)) c.retired=true; else list.splice(i,1);
      buzz(); if(G) save(); renderCustoms(cfg, box);
    };
    box.appendChild(row);
  });
}
function rulesSheet(){ // édition des règles maison en cours de partie
  openSheet(`<h3>${T.houseRules}</h3>
    <div class="small muted" style="margin-bottom:10px">${T.rulesLive}</div>
    <div id="rl"></div><div style="height:12px"></div>
    <button class="btn ghost" id="radd">${T.addRule}</button>
    <div style="height:8px"></div><button class="btn" id="rdone">${T.done}</button>`);
  const box=$('#rl');
  renderCustoms(G.cfg, box);
  $('#radd').onclick=()=>ruleSheet(G.cfg, null, ()=>{ save(); rulesSheet(); });
  $('#rdone').onclick=()=>{ closeSheet(); save(); if(view==='round') renderRound2(); };
}
function ruleSheet(cfg, i, after){
  const list=cfg.custom||(cfg.custom=[]);
  const isNew = i==null;
  const c = isNew ? {id:'c'+Date.now().toString(36), name:'', pts:10, max:1, tricks:0, cond:'always'} : Object.assign({tricks:0}, list[i]);
  openSheet(`<h3>${isNew?T.ruleNew:T.ruleEdit}</h3>
    <div class="small muted" style="margin-bottom:12px">${T.ruleEx}</div>
    <input type="text" id="rn" placeholder="${T.ruleName}" maxlength="28" value="${esc(c.name)}">
    <div class="brow" style="margin-top:6px"><div class="lbl">${T.rulePts}<small>${T.rulePtsD}</small></div><div class="step" id="rp"></div></div>
    <div class="qgrid" style="grid-template-columns:repeat(2,1fr)">
      <button class="qbtn minus" data-p="-10">-10</button><button class="qbtn" data-p="10">+10</button>
    </div>
    <input type="text" id="rpin" inputmode="numeric" placeholder="${T.exactValue}" value="${c.pts}">
    <div class="brow" style="margin-top:8px"><div class="lbl">${T.ruleTricks}<small>${T.ruleTricksD}</small></div><div class="step" id="rt"></div></div>
    <div class="brow"><div class="lbl">${T.ruleMax}<small>${T.ruleMaxD}</small></div><div class="step" id="rm"></div></div>
    <div class="brow"><div class="lbl">${T.ruleCond}<small>${c.cond==='bid'?T.ruleCondOn:T.ruleCondOff}</small></div><div class="sw ${c.cond==='bid'?'on':''}" id="rc"></div></div>
    <div style="height:14px"></div>
    <button class="btn" id="rok">${isNew?T.add:T.saveBtn}</button>

  const nameEl=$('#rn');
  nameEl.oninput=e=>c.name=e.target.value;
  const ptsStep=$('#rp');
  const repaintPts=()=>{ stepper(ptsStep, c.pts, -200, 200, v=>{c.pts=v; $('#rpin').value=String(v)}); $('#rpin').value=String(c.pts); };
  repaintPts();
  document.querySelectorAll('.qgrid .qbtn').forEach(b=>b.onclick=()=>{ c.pts=Math.max(-200,Math.min(200,c.pts+ +b.dataset.p)); buzz(); repaintPts(); });
  $('#rpin').oninput=e=>{
    const t=e.target.value.replace(/[^0-9-]/g,''); if(t!==e.target.value) e.target.value=t;
    const n=parseInt(t,10); if(!isNaN(n)){ c.pts=Math.max(-200,Math.min(200,n)); stepper(ptsStep, c.pts, -200, 200, v=>{c.pts=v; $('#rpin').value=String(v)}); }
  };
  stepper($('#rt'), c.tricks||0, 0, 4, v=>{c.tricks=v});
  stepper($('#rm'), c.max, 1, 10, v=>{c.max=v});
  $('#rc').onclick=e=>{ c.cond = c.cond==='bid'?'always':'bid'; e.target.classList.toggle('on'); buzz();
    e.target.parentNode.querySelector('small').textContent = c.cond==='bid'?T.ruleCondOn:T.ruleCondOff; };
  $('#rca').onclick=closeSheet;
  $('#rok').onclick=()=>{
    c.name=(c.name||'').trim()||T.ruleDefault;
    if(isNew) list.push(c); else list[i]=c;
    closeSheet(); buzz(14); after && after();
  };
}

function stepper(node, val, min, max, cb, label){
  node.innerHTML='';
  const nom = label ? ' ' + label : '';
  const el=h(`<button class="minus" aria-label="${esc(T.aLess + nom)}">−</button><div class="v" role="status" aria-live="polite">${val}</div><button class="plus" aria-label="${esc(T.aMore + nom)}">+</button>`);
  node.appendChild(el);
  const v=node.querySelector('.v');
  const upd=n=>{ val=Math.max(min,Math.min(max,n)); v.textContent=val; buzz();
    node.querySelector('.minus').disabled=val<=min; node.querySelector('.plus').disabled=val>=max; cb(val); };
  node.querySelector('.minus').onclick=()=>upd(val-1);
  node.querySelector('.plus').onclick=()=>upd(val+1);
  node.querySelector('.minus').disabled=val<=min; node.querySelector('.plus').disabled=val>=max;
}

/* ---------- Écran manche ---------- */
function renderRound(){
  const ri=G.cur, r=G.rounds[ri], cards=cardsForRound(G.cfg,G.players.length,ri);
  const dealer=G.players[ri%G.players.length];
  const bidding = G.phase==='bid';
  $('#hTitle').textContent = T.roundHead(ri+1, G.rounds.length, cards);
  $('#hSub').textContent = (bidding?T.phaseBid:T.phaseRes) + ' · ' + T.dealer + ' : ' + dealer.name;

  const wrap=h(`<div>${bidding?'':'<div class="small muted" style="margin:0 2px 9px">'+T.resHint+'</div>'}<div id="rows"></div></div>`);
  $('#app').appendChild(wrap);
  const rows=$('#rows');
  const st = G.rounds.some(x=>x.locked) ? standings(G) : null;
  G.players.forEach(p=>{ if(r.bids[p.id]==null) r.bids[p.id]=0; if(r.tricks[p.id]==null) r.tricks[p.id]=0; });

  /* Le plafond d'un joueur depend de ce que prennent les autres : toutes les
     lignes se repeignent des qu'une valeur bouge. */
  const painters=[];
  /* En resultats, un joueur ne peut pas prendre plus que ce qui reste a
     distribuer. En annonces le plafond reste la manche entiere : la somme des
     annonces n'a aucune raison de tomber juste. */
  const plafond = pid => {
    const cap = roundCapacity(G,ri).cap;
    if(bidding) return cap;
    const autres = G.players.reduce((s,q)=> s + (q.id===pid ? 0 : (r.tricks[q.id]||0)), 0);
    return Math.max(0, cap - autres);
  };
  G.players.forEach((p,i)=>{
    const bid=r.bids[p.id], tr=r.tricks[p.id];
    const cur = bidding?bid:tr, set = cur!=null;
    const bp = bonusPoints(r.bonus[p.id]);
    const totNow = st ? (st.cum[p.id].length?st.cum[p.id][st.cum[p.id].length-1]:0) : 0;
    const frag=h(`<div class="pr">
      ${avatar(p,i)}
      <div class="grow"><div class="nm">${esc(p.name)}</div><div class="sub2"></div></div>
      ${bidding?'':`<button class="star" title="${esc(T.bonusTitle)}" aria-label="${esc(T.bonusTitle)}">★</button>`}
      <div class="step big"><button class="minus" aria-label="${esc(T.aLess + ' ' + p.name)}">−</button><div class="v" role="status" aria-live="polite"></div><button class="plus" aria-label="${esc(T.aMore + ' ' + p.name)}">+</button></div>
    </div>`);
    const card=frag.firstElementChild;
    const vEl=card.querySelector('.v'), subEl=card.querySelector('.sub2'), starEl=card.querySelector('.star');
    const get=()=> (bidding ? r.bids[p.id] : r.tricks[p.id]) || 0;
    const set_=v=>{ if(bidding) r.bids[p.id]=v; else r.tricks[p.id]=v; };
    function paint(){
      const v=get(), bo=r.bonus[p.id], bp2=bonusPoints(bo, G.cfg);
      vEl.textContent = v;
      vEl.className = 'v'+(v>0?' on':' none');
      card.className = 'pr '+(v>0?'set':'');
      if(bidding){ subEl.innerHTML = st? totNow+' pts' : T.newGameSub; }
      else {
        const b0=(r.bid0||{})[p.id], cur=r.bids[p.id]||0, moved=(b0!=null && b0!==cur);
        const pir=(bo&&bo.pir)||[];
        subEl.innerHTML =
          `<span class="mise${moved?' moved':''}">${T.bet(cur)}${moved?' <i>⇠'+b0+'</i>':''}</span>`
          + (pir.length? ' · <b>⚑ '+pir.length+'</b>' : '')
          + (bo&&bo.wager? ' · <b>'+T.wagerShort(bo.wager)+'</b>' : '')
          + (bp2? ' · <b>★ '+sgn(bp2)+'</b>' : '')
          + (bo&&bo.note? ' · '+esc(bo.note) : '');
        const m=subEl.querySelector('.mise');
        if(m && G.cfg.pirates) m.onclick=e=>{ e.stopPropagation(); harrySheet(p, ri, paint); };
      }
      if(starEl) starEl.className='star'+(bp2?' on':'');
      card.querySelector('.minus').disabled = v<=0;
      card.querySelector('.plus').disabled  = v>=plafond(p.id);
      renderBar(ri);
    }
    painters.push(paint);
    const bump=d=>{
      set_(Math.max(0, Math.min(plafond(p.id), get()+d)));
      buzz(); save(); painters.forEach(f=>f());
    };
    [['minus',-1],['plus',1]].forEach(([cls,d])=>{
      const b=card.querySelector('.'+cls);
      let t1,t2;
      const stop=()=>{clearTimeout(t1);clearInterval(t2)};
      b.addEventListener('click',e=>{e.preventDefault();bump(d)});
      b.addEventListener('pointerdown',()=>{ t1=setTimeout(()=>{ t2=setInterval(()=>{ if(b.disabled){stop();return;} bump(d); },130); },420); });
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
    });
    if(starEl) starEl.onclick=()=>bonusSheet(p, ri, paint);
    if(!bidding){ // appui long sur la ligne : ajustement libre immédiat
      let lt, sx=0, sy=0;
      const cancel=()=>clearTimeout(lt);
      card.addEventListener('pointerdown',e=>{
        if(e.target.closest('button')) return;
        sx=e.clientX; sy=e.clientY;
        lt=setTimeout(()=>{ buzz(25); quickSheet(p, ri, paint); }, 480);
      });
      card.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-sx)>12||Math.abs(e.clientY-sy)>12) cancel(); });
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>card.addEventListener(ev,cancel));
    }
    paint();
    rows.appendChild(card);
  });

  renderBar(ri);
}

/* Réglage manuel du nombre de plis disponibles dans la manche */
function capacitySheet(ri){
  const r=G.rounds[ri], {cards, extra, cap} = roundCapacity(G, ri);
  const fromRules = extra - (r.extra||0);
  openSheet(`<h3>${T.capTitle}</h3>
    <div class="small muted" style="margin-bottom:10px">${T.capRound(ri+1)}</div>
    <div class="kv"><span>${T.capDealt}</span><span>${cards}</span></div>
    ${fromRules?`<div class="kv"><span>${T.capFromRules}</span><span>+${fromRules}</span></div>`:''}
    <div class="brow"><div class="lbl">${T.capManual}<small>${T.capManualD}</small></div><div class="step" id="ce"></div></div>
    <div class="row" style="margin-top:8px"><div class="grow small muted">${T.capTotal}</div><div class="tot" id="ctot">${cap}</div></div>
    <div style="height:14px"></div>
    <button class="btn" id="cok">${T.done}</button>`);
  /* Retirer plus de plis qu'il n'y a de cartes n'a pas de sens : la manche
     deviendrait invalidable, et le bandeau affichait une capacite negative. */
  stepper($('#ce'), r.extra||0, -(cards+fromRules), 10, v=>{ r.extra=v; save(); $('#ctot').textContent=roundCapacity(G,ri).cap; });
  $('#cok').onclick=()=>{ closeSheet(); save(); renderRound2(); };
}

/* Barre du bas de l'écran manche : compteurs et bouton de validation */
function renderBar(ri){
  const r=G.rounds[ri], bidding=G.phase==='bid';
  const {cards, extra, cap} = roundCapacity(G, ri);
  const btns=$('#barBtns'), hint=$('#barHint');
  btns.innerHTML=''; hint.className='hint'; hint.onclick=null; hint.style.cursor='';
  const capNote = extra ? T.capNote(cards, extra) : '';
  if(bidding){
    const sum=G.players.reduce((s,p)=>s+(r.bids[p.id]||0),0);
    const d=sum-cap;
    hint.textContent=T.totalBid(sum, cap)+(d>0?T.over(d):d<0?T.under(-d):T.exactBid);
    btns.appendChild(h(`<button class="btn" id="ok">${T.bidsDone}</button>`));
    $('#ok').onclick=()=>{ if(!freshTap()) return;
      G.phase='res';
      /* L'annonce de reference se fixe une fois pour la manche. La recopier a
         chaque passage aux resultats transformait la modification de Harry en
         nouvelle reference : la trace disparaissait et la borne du pouvoir
         derivait d'un pli a chaque aller retour. */
      if(!r.bid0) r.bid0=Object.assign({}, r.bids);
      save(); buzz(14); renderRound2(); };
    if(ri>0 && G.rounds[ri-1].locked){
      btns.appendChild(h(`<div style="height:8px"></div><button class="btn ghost sm" id="backSc">${T.backToScores}</button>`));
      $('#backSc').onclick=()=>{ save(); goRoot('scores'); };
    }
  } else {
    const sum=G.players.reduce((s,p)=>s+(r.tricks[p.id]||0),0);
    const short=cap-sum;
    const adj=' · <u>'+T.adjust+'</u>';
    if(sum>cap){ hint.innerHTML=T.tooMany(sum,cap)+capNote+adj; hint.className='hint warn'; }
    else if(short>0){ hint.innerHTML=(G.cfg.kraken ? T.krakenQ(sum,cap,short) : T.onlyN(sum,cap))+adj; hint.className='hint warn'; }
    else hint.innerHTML=T.allTricks(cap)+capNote+adj;
    hint.style.cursor='pointer';
    hint.onclick=()=>capacitySheet(ri);
    btns.appendChild(h(`<button class="btn" id="ok" ${sum>cap?'disabled':''}>${T.validateRound}</button>`));
    btns.appendChild(h(`<div style="height:8px"></div><button class="btn ghost sm" id="back">${T.backToBids}</button>`));
    $('#back').onclick=()=>{ if(!freshTap()) return; G.phase='bid'; save(); renderRound2(); };
    if(sum<=cap) $('#ok').onclick=()=>{ if(freshTap()) lockRound(ri); };
  }
}
function renderRound2(){ $('#app').innerHTML=''; $('#barBtns').innerHTML=''; $('#barHint').textContent=''; $('#barHint').className='hint'; renderRound(); }

function lockRound(ri){
  const r=G.rounds[ri];
  r.locked=true;
  buzz(20); save();
  goRoot('scores');
}

/* ---------- Feuille de bonus ---------- */
function bonusSheet(p, ri, repaint){
  const r=G.rounds[ri], cards=cardsForRound(G.cfg,G.players.length,ri);
  r.bonus[p.id] = r.bonus[p.id] || {};
  const b=r.bonus[p.id];
  const defs = BONUS_DEFS.filter(d=>!d.need || G.cfg[d.need]).filter(d=>!d.free);
  const customs = liveRules(G.cfg);
  openSheet(`<h3>${T.bonusOf(esc(p.name))}</h3>
    ${G.cfg.pirates?'<h2 style="margin:10px 0 2px">'+T.piratesTitle+'</h2><div class="small muted" style="margin-bottom:4px">'+T.piratesIntro+'</div><div class="pgrid" id="bp"></div><div id="bw"></div>':''}
    <h2 style="margin:16px 0 2px">${T.cardBonus}</h2>
    <div class="small muted" style="margin-bottom:8px">${T.bonusIntro}${G.cfg.scoring==='classic'&&G.cfg.bonusIfExact?T.bonusIfExact:''}</div>
    <div id="bl"></div>
    ${customs.length?'<h2 style="margin:16px 0 2px">'+T.houseRules+'</h2><div id="bc"></div>':''}
    <h2 style="margin:16px 0 2px">${T.freeAdj}</h2>
    <div id="bf"></div>
    <div style="height:14px"></div>
    <div class="row"><div class="grow small muted">${T.totalBonus}</div><div class="tot" id="btot">0</div></div>
    <div class="small muted" id="bwn" style="margin-top:6px"></div>
    <div style="height:12px"></div>
    <button class="btn" id="bok">${T.done}</button>`);
  const upTot=()=>{
    $('#btot').textContent=sgn(bonusPoints(b, G.cfg));
    const n=$('#bwn');
    if(n) n.textContent = b.wager ? T.wagerNote(b.wager) : '';
  };
  const addRow=(node,label,hint,key,max)=>{
    const row=h(`<div class="brow"><div class="lbl">${label}<small>${hint}</small></div><div class="step"></div></div>`);
    stepper(row.querySelector('.step'), b[key]||0, 0, max, v=>{b[key]=v;save();upTot()});
    node.appendChild(row);
  };
  if(G.cfg.pirates){
    b.pir = b.pir || [];
    const wrap=$('#bw');
    const paintWager=()=>{
      wrap.innerHTML='';
      if(!b.pir.includes('rascal')){ if(b.wager){ b.wager=0; save(); } upTot(); return; }
      wrap.appendChild(h(`<div style="margin-top:10px"><div class="lbl">${T.wagerTitle}<small class="muted" style="display:block;font-size:12.5px">${T.wagerDesc}</small></div>
        <div class="wgrid">${[0,10,20].map(v=>`<button class="qbtn ${(b.wager||0)===v?'on':''}" data-w="${v}" style="${(b.wager||0)===v?'background:var(--gold);color:#1a1206;border-color:var(--gold)':''}">${v===0?T.wagerNone:'+'+v}</button>`).join('')}</div></div>`));
      wrap.querySelectorAll('[data-w]').forEach(btn=>btn.onclick=()=>{ b.wager=+btn.dataset.w; buzz(); save(); paintWager(); upTot(); });
    };
    const pg=$('#bp');
    PIRATES.forEach(pi=>{
      const on=b.pir.includes(pi.k);
      const c=h(`<button class="pchip ${on?'on':''}"><span class="pk">${on?'⚑':'○'}</span><span><span class="pn">${T.pirNames[pi.k]}</span><span class="pp">${T.pirPow[pi.k]}</span></span></button>`).firstElementChild;
      c.onclick=()=>{
        const i=b.pir.indexOf(pi.k);
        if(i>=0) b.pir.splice(i,1); else b.pir.push(pi.k);
        buzz(); save();
        c.classList.toggle('on'); c.querySelector('.pk').textContent=b.pir.includes(pi.k)?'⚑':'○';
        if(pi.k==='rascal') paintWager();
        if(pi.k==='harry' && b.pir.includes('harry')){ closeSheet(); setTimeout(()=>harrySheet(p, ri, ()=>{ renderRound2(); }), 240); }
      };
      pg.appendChild(c);
    });
    paintWager();
  }
  defs.forEach(d=>addRow($('#bl'), T[d.i], T[d.i+'d'], d.k, Math.min(d.max, Math.max(1,cards))));
  customs.forEach(c=>addRow($('#bc'), esc(c.name), `${sgn(c.pts)} pts${c.tricks?' · '+T.ruleWorth(c.tricks):''} · ${c.cond==='bid'?T.ruleTagOn:T.ruleTagOff}`, 'x'+c.id, c.max));
  freeEditor($('#bf'), b, upTot);
  upTot();
  $('#bok').onclick=()=>{ closeSheet(); save(); renderRound2(); };
}

/* Éditeur de points libres : valeur, raccourcis, saisie directe, note.
   Toujours acquis, quelle que soit la réussite de l'annonce. */
function freeEditor(node, b, onChange){
  node.innerHTML='';
  node.appendChild(h(`
    <div class="bigval" id="fv">0</div>
    <div class="qgrid" style="grid-template-columns:repeat(2,1fr)">
      <button class="qbtn minus" data-p="-10">-10</button>
      <button class="qbtn" data-p="10">+10</button>
    </div>
    <div class="row" style="gap:7px;margin-top:8px">
      <input type="text" id="fin" class="grow" inputmode="numeric" placeholder="${T.exactValue}" value="${b.free?b.free:''}">
      <button class="mini" id="fz" title="${T.resetZero}" style="width:46px;height:46px;flex:0 0 46px">⟲</button>
    </div>
    <input type="text" id="fnote" placeholder="${T.noteHint}" maxlength="40" style="margin-top:7px" value="${esc(b.note||'')}">
    <div class="small muted" style="margin-top:6px">${T.freeNote}</div>`));
  const fv=node.querySelector('#fv');
  const paint=()=>{ const v=b.free||0; fv.textContent=sgn(v); fv.className='bigval'+(v?'':' z'); onChange&&onChange(); };
  node.querySelectorAll('.qgrid .qbtn').forEach(btn=>btn.onclick=()=>{
    b.free=(b.free||0)+ +btn.dataset.p; buzz(); save();
    node.querySelector('#fin').value = b.free ? String(b.free) : '';
    paint();
  });
  node.querySelector('#fin').oninput=e=>{
    const t=e.target.value.replace(/[^0-9+-]/g,'');
    if(t!==e.target.value) e.target.value=t;
    const n=parseInt(t,10); b.free = isNaN(n)?0:n; save(); paint();
  };
  node.querySelector('#fz').onclick=()=>{ b.free=0; node.querySelector('#fin').value=''; buzz(); save(); paint(); };
  node.querySelector('#fnote').oninput=e=>{ b.note=e.target.value; save(); };
  paint();
}

/* Harry le Géant : ajuste l'annonce de plus ou moins 1 en pleine manche */
function harrySheet(p, ri, repaint){
  const r=G.rounds[ri];
  r.bid0 = r.bid0 || Object.assign({}, r.bids);
  const base = r.bid0[p.id]||0, cap = roundCapacity(G,ri).cap;
  const lo = Math.max(0, base-1), hi = Math.min(cap, base+1);
  openSheet(`<h3>${T.harryTitle(esc(p.name))}</h3>
    <div class="small muted" style="margin-bottom:12px">${T.harryDesc(base)}</div>
    <div class="brow"><div class="lbl">${T.harryKept}<small>${T.harryBound}</small></div><div class="step" id="hs"></div></div>
    <div style="height:14px"></div>
    <button class="btn" id="hok">${T.done}</button>
    <div style="height:8px"></div><button class="btn ghost sm" id="hrz">${T.harryBack(base)}</button>`);
  stepper($('#hs'), r.bids[p.id]||0, lo, hi, v=>{ r.bids[p.id]=v; save(); });
  $('#hrz').onclick=()=>{ r.bids[p.id]=base; save(); buzz(); closeSheet(); repaint&&repaint(); };
  $('#hok').onclick=()=>{ closeSheet(); save(); repaint&&repaint(); };
}

/* ---------- Écran scores ---------- */
function renderScores(){
  const st=standings(G);
  const done = G.rounds.every(r=>r.locked);
  $('#hTitle').textContent = done ? T.gameOver : T.scores;
  $('#hSub').textContent = T.roundsPlayed(st.played, G.rounds.length);

  /* Manches rouvertes puis laissees en plan : leurs points ne sont pas
     comptes, il faut le dire plutot que de laisser croire a un total ferme. */
  const lastLock = (()=>{ for(let i=G.rounds.length-1;i>=0;i--) if(G.rounds[i].locked) return i; return -1; })();
  const pending = G.rounds.map((r,i)=>(!r.locked && i<lastLock) ? i+1 : 0).filter(Boolean);
  const wrap=h(`<div><div id="lead"></div>
    ${pending.length?`<div class="small" style="color:var(--warn);margin:10px 2px 0">${T.pendingRounds(pending)}</div>`:''}
    <h2>${T.progression}</h2><div class="chartbox"><div id="chart"></div><div class="legend" id="lgd"></div></div>
    <h2>${T.perRound}</h2><div class="tblwrap" id="tbl"></div>
    <div class="small muted" style="margin:8px 2px">${T.tapRound}</div></div>`);
  $('#app').appendChild(wrap);

  const lead=$('#lead');
  const rk=ranks(st.tot);
  st.tot.forEach((t,i)=>{
    const d=t.last, cls = d>0?'pos':(d<0?'neg':'zero');
    lead.appendChild(h(`<div class="lead ${rk[i]===1&&st.played?'first':''}">
      <div class="rank">${rk[i]}</div>
      ${avatar(t.p,i)}
      <div class="grow"><div class="nm">${esc(t.p.name)}</div></div>
      ${st.played?`<div class="delta ${cls}">${sgn(d)}</div>`:''}
      <div class="tot">${t.total}</div></div>`));
  });

  drawChart($('#chart'), st, G);
  const lgd=$('#lgd');
  G.players.forEach((p,i)=>lgd.appendChild(h(`<div class="lg"><i style="background:${pcol(p,i)}"></i>${pico(p)} ${esc(p.name)}</div>`)));
  buildTable($('#tbl'), st, G, true);

  const btns=$('#barBtns');
  const lastLocked = (()=>{ for(let i=G.rounds.length-1;i>=0;i--) if(G.rounds[i].locked) return i; return -1; })();
  const addUndo = ()=>{
    if(lastLocked<0) return;
    btns.appendChild(h(`<div style="height:8px"></div><button class="btn ghost sm" id="undoR">${T.backToRound(lastLocked+1)}</button>`));
    $('#undoR').onclick=()=>{
      if(!freshTap()) return;
      G.rounds[lastLocked].locked=false; G.cur=lastLocked; G.phase='res';
      save(); buzz(); goRoot('round');
    };
  };
  if(!done){
    btns.appendChild(h(`<button class="btn" id="next">${T.nextRound(G.cur+2)}</button>`));
    $('#next').onclick=()=>{ if(!freshTap()) return;
      G.cur=G.rounds.findIndex(r=>!r.locked); G.phase='bid'; save(); buzz(14); goRoot('round'); };
    addUndo();
  } else {
    const top=leaders(st.tot);
    $('#barHint').textContent = top.length>1
      ? T.tieWinner(top.map(t=>t.p.name), top[0].total)
      : T.winner(top[0].p.name, top[0].total);
    btns.appendChild(h(`<button class="btn" id="share">${T.shareResult}</button>`));
    $('#share').onclick=shareResult;
    btns.appendChild(h(`<div style="height:8px"></div><div class="row" style="gap:8px"><button class="btn ghost sm grow" id="hof2">${T.hofTitle}</button><button class="btn ghost sm grow" id="new">${T.newGame}</button></div>`));
    $('#hof2').onclick=()=>go('hof');
    $('#new').onclick=()=>{ if(confirm(T.confirmNew)){ Store.del('sk_game'); G=null; draft=newDraft(); goRoot('setup'); } };
    addUndo();
  }
}

function buildTable(node, st, game, editable){
  const G=game;
  const played=st.played, idx=st.idx||[];
  let head='<tr><th>'+T.colPlayer+'</th>';
  for(let i=0;i<played;i++) head+=`<th data-r="${idx[i]}">${T.colRound(idx[i]+1)}</th>`;
  head+='<th>'+T.colTotal+'</th></tr>';
  let body='';
  G.players.forEach(p=>{
    body+=`<tr><td>${esc(p.name)}</td>`;
    for(let i=0;i<played;i++){
      const s=st.per[p.id][i];
      body+=`<td class="${s.total<0?'neg':''}">${sgn(s.total)}</td>`;
    }
    body+=`<td style="font-weight:800">${st.cum[p.id][played-1]||0}</td></tr>`;
  });
  node.innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  if(editable) node.querySelectorAll('th[data-r]').forEach(th=>th.onclick=()=>editRound(+th.dataset.r));
}
function editRound(ri){
  openSheet(`<h3>${T.editRoundTitle(ri+1)}</h3><div class="small muted" style="margin-bottom:12px">${T.editRoundDesc}</div>
    <button class="btn" id="ed">${T.editRoundBtn}</button><div style="height:8px"></div><button class="btn ghost sm" id="ca">${T.cancel}</button>`);
  $('#ca').onclick=closeSheet;
  $('#ed').onclick=()=>{ closeSheet(); G.rounds[ri].locked=false; G.cur=ri; G.phase='bid'; save(); goRoot('round'); };
}

/* ---------- Graphique de progression ---------- */
function niceStep(raw){
  const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,raw))));
  const r=raw/p;
  return (r<=1?1:r<=2?2:r<=5?5:10)*p;
}
function drawChart(node, st, game){
  const G=game;
  const n=st.played;
  if(n<1){ node.innerHTML=`<div class="small muted" style="padding:26px 10px;text-align:center">${esc(T.chartLater)}</div>`; return; }
  const W=Math.max(280, node.clientWidth||300), H=200, mL=38, mR=16, mT=10, mB=24;
  const ser=G.players.map(p=>({p, v:[0].concat(st.cum[p.id])}));
  let lo=0, hi=0;
  ser.forEach(s=>s.v.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));
  const step=niceStep((hi-lo)/4||10);
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi===lo) hi=lo+step;
  const X=i=>mL+(W-mL-mR)*(i/n);
  const Y=v=>mT+(H-mT-mB)*(1-(v-lo)/(hi-lo));
  let g='', ax='';
  for(let v=lo; v<=hi+.001; v+=step){
    g+=`<line x1="${mL}" y1="${Y(v).toFixed(1)}" x2="${W-mR}" y2="${Y(v).toFixed(1)}" stroke="${v===0?'#383835':'#2c2c2a'}" stroke-width="1"/>`;
    ax+=`<text x="${mL-7}" y="${(Y(v)+4).toFixed(1)}" fill="#8b95a1" font-size="10.5" text-anchor="end">${v}</text>`;
  }
  const nums=(st.idx||[]).map(r=>r+1);
  for(let i=0;i<=n;i++){ if(n>6 && i%2) continue;
    ax+=`<text x="${X(i).toFixed(1)}" y="${H-7}" fill="#8b95a1" font-size="10.5" text-anchor="middle">${i?nums[i-1]:''}</text>`; }
  let lines='', ends='', labels='';
  const few = ser.length<=4, lab=[];
  ser.forEach(s=>{
    const c=pcol(s.p, ser.indexOf(s));
    const d=s.v.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    lines+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    const lx=X(n), ly=Y(s.v[n]);
    ends+=`<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="${c}" stroke="#16202b" stroke-width="2"/>`;
    lab.push({name:s.p.name, y:ly-9});
  });
  if(few){ // anti-collision : on écarte les étiquettes qui se chevauchent
    lab.sort((a,b)=>a.y-b.y);
    for(let i=1;i<lab.length;i++) if(lab[i].y-lab[i-1].y<14) lab[i].y=lab[i-1].y+14;
    const over=lab.length?lab[lab.length-1].y-(H-mB-2):0;
    if(over>0) lab.forEach(l=>l.y-=over);
    lab.forEach(l=>{ labels+=`<text x="${(X(n)-9).toFixed(1)}" y="${Math.max(mT+9,l.y).toFixed(1)}" fill="#c3c2b7" font-size="11" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#16202b" stroke-width="3">${esc(l.name)}</text>`; });
  }
  ends+=labels;
  node.style.position='relative';
  node.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="display:block">
    ${g}${ax}<line class="cross" x1="0" y1="${mT}" x2="0" y2="${H-mB}" stroke="#8b95a1" stroke-width="1" opacity="0"/>
    ${lines}${ends}<rect x="${mL}" y="0" width="${W-mL-mR}" height="${H}" fill="transparent" class="hit"/></svg>
    <div class="tip" style="position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:#26374a;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.5;white-space:nowrap;top:6px"></div>`;
  const svg=node.querySelector('svg'), cross=node.querySelector('.cross'), tip=node.querySelector('.tip');
  const move=e=>{
    const b=svg.getBoundingClientRect(), px=((e.touches?e.touches[0].clientX:e.clientX)-b.left)/b.width*W;
    let i=Math.round((px-mL)/((W-mL-mR)/n)); i=Math.max(0,Math.min(n,i));
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity','.45');
    const rows=ser.map((s,k)=>({n:pico(s.p)+' '+s.p.name,v:s.v[i],c:pcol(s.p,k)})).sort((a,b)=>b.v-a.v);
    tip.innerHTML=`<b>${i?T.chartAfter(nums[i-1]):T.chartStart}</b><br>`+rows.map(r=>`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${r.c};margin-right:5px"></span>${esc(r.n)} <b style="float:right;margin-left:12px">${r.v}</b>`).join('<br>');
    tip.style.opacity='1';
    tip.style.left = (X(i)/W*100 > 55 ? '8px' : 'auto'); tip.style.right = (X(i)/W*100 > 55 ? 'auto' : '8px');
    if(e.cancelable) e.preventDefault();
  };
  const off=()=>{cross.setAttribute('opacity','0'); tip.style.opacity='0'};
  svg.addEventListener('touchstart',move,{passive:false});
  svg.addEventListener('touchmove',move,{passive:false});
  svg.addEventListener('touchend',off);
  svg.addEventListener('mousemove',move);
  svg.addEventListener('mouseleave',off);
}

function playerEditSheet(id, cb){
  const existing = id ? roster().find(x=>x.id===id) : null;
  const st = {
    name: existing? existing.name : '',
    color: existing&&existing.color ? existing.color : freeColor(),
    icon: existing&&existing.icon ? existing.icon : freeIcon()
  };
  openSheet(`<h3>${existing?T.editPlayerTitle:T.newPlayerTitle}</h3>

      <input type="color" id="ccus" value="${st.color}">
      <div class="grow small muted" id="cwarn">${T.colorFree}</div>
    </div>
    <h2 style="margin:16px 0 2px">${T.pictoTitle}</h2>
    <div class="egrid" id="eg"></div>
    <div style="height:14px"></div>
    <button class="btn" id="pok">${existing?T.saveBtn:T.add}</button>
    <div style="height:8px"></div><button class="btn ghost sm" id="pca">${T.cancel}</button>`);

  const prev=$('#prev'), cg=$('#cg'), eg=$('#eg'), warn=$('#cwarn');
  function paintPrev(){
    prev.innerHTML=`<div class="av big" style="border-color:${st.color};background:${st.color}22">${st.icon}</div>`;
    const c=contrast(st.color, SURFACE);
    warn.innerHTML = c<3 ? '<span style="color:var(--warn)">'+T.colorDark+'</span>' : T.colorFree;
    cg.querySelectorAll('.cb').forEach(b=>b.classList.toggle('on', b.dataset.c.toLowerCase()===st.color.toLowerCase()));
    $('#ccus').value=st.color;
  }
  SERIES_HEX.forEach(c=>{
    const b=h(`<button class="cb" data-c="${c}" style="background:${c}"></button>`).firstElementChild;
    b.onclick=()=>{ st.color=c; buzz(); paintPrev(); };
    cg.appendChild(b);
  });
  $('#ccus').oninput=e=>{ st.color=e.target.value; paintPrev(); };
  PICTOS.forEach(ic=>{
    const b=h(`<button class="eb ${ic===st.icon?'on':''}">${ic}</button>`).firstElementChild;
    b.onclick=()=>{ st.icon=ic; buzz(); eg.querySelectorAll('.eb').forEach(x=>x.classList.remove('on')); b.classList.add('on'); paintPrev(); };
    eg.appendChild(b);
  });
  paintPrev();
  /* Deux fiches peuvent legitimement porter le meme prenom, mais rien ne les
     distinguait ensuite dans la selection de partie : on le signale sans
     l'interdire. */
  const dup=()=>{
    const n=(st.name||'').trim().toLowerCase();
    const pris = n && roster().some(x=>x.id!==id && (x.name||'').trim().toLowerCase()===n);
    $('#pdup').textContent = pris ? T.dupName : '';
  };
  $('#pn').oninput=e=>{ st.name=e.target.value; dup(); };
  dup();
  if(!existing) setTimeout(()=>$('#pn').focus(), 260);
  $('#pca').onclick=closeSheet;
  $('#pok').onclick=()=>{
    const nm=(st.name||'').trim();
    if(!nm){ toast(T.needName); return; }
    const fix=ensureReadable(st.color);
    const l=roster();
    let pid=id;
    if(existing){
      const t=l.find(x=>x.id===id);
      t.name=nm; t.color=fix.color; t.icon=st.icon;
      saveRoster(l);
      const a=archive();
      a.forEach(g=>g.players.forEach(pp=>{ if(pp.id===id) pp.name=nm; }));
      saveArchive(a);
      if(G){ G.players.forEach(pp=>{ if(pp.id===id){ pp.name=nm; pp.color=fix.color; pp.icon=st.icon; } }); save(); }
    } else {
      pid=uid('j');
      l.push({id:pid, name:nm, color:fix.color, icon:st.icon, created:Date.now()});
      saveRoster(l);
    }
    if(fix.adjusted) toast(T.colorFixed);
    closeSheet(); buzz(14); cb && cb(pid); if(!cb) render();
  };
}

/* Parties ou les deux fiches figurent toutes les deux : leurs deux lignes ne
   peuvent pas se reduire a une seule sans inventer un score, la fusion est
   donc refusee tant qu'il en reste une. */
function mergeConflicts(id, oid){
  return archive().filter(g=>{
    const l = g && Array.isArray(g.players) ? g.players : [];
    return l.some(x=>x&&x.id===id) && l.some(x=>x&&x.id===oid);
  });
}
/* Deplace toute trace de `id` vers `oid` dans une partie : la ligne joueur,
   mais aussi les annonces, les plis, les bonus, l'annonce initiale de Harry
   et le score final d'une partie saisie a la main. */
function reindexGame(g, id, oid, oname){
  if(!g || !Array.isArray(g.players) || !g.players.some(x=>x&&x.id===id)) return false;
  g.players.forEach(pp=>{ if(pp&&pp.id===id){ pp.id=oid; pp.name=oname; } });
  const move=o=>{ if(o && Object.prototype.hasOwnProperty.call(o,id)){ o[oid]=o[id]; delete o[id]; } };
  (Array.isArray(g.rounds)?g.rounds:[]).forEach(r=>{
    if(!r) return;
    move(r.bids); move(r.tricks); move(r.bonus); move(r.bid0);
  });
  move(g.finals);
  return true;
}
function mergePlayers(id, oid, oname){
  const a=archive();
  a.forEach(g=>reindexGame(g, id, oid, oname));
  saveArchive(a);
  if(reindexGame(G, id, oid, oname)) save();
  Store.set('sk_lastsel', Store.get('sk_lastsel', []).map(x=>x===id?oid:x));
  if(draft) draft.sel = draft.sel.map(x=>x===id?oid:x);
  saveRoster(roster().filter(x=>x.id!==id));
}
function mergeSheet(id){
