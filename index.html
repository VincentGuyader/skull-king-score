/* ---------- Sauvegarde vers un fichier ---------- */
/* Inspecte une sauvegarde AVANT d'ecrire quoi que ce soit. Renvoie le contenu
   a poser, ou {bad:n} quand n parties sont inexploitables, ou null si le
   fichier n'a pas la forme d'une sauvegarde. */
function readBackup(d){
  if(!d || typeof d!=='object' || Array.isArray(d)) return null;
  if(!Array.isArray(d.archive)) return null;
  if(d.roster!=null && !Array.isArray(d.roster)) return null;
  const bad=d.archive.filter(g=>!validGame(g)).length;
  if(bad) return {bad};
  return {archive:d.archive, roster:d.roster||[], cfg:d.cfg, lang:d.lang};
}
function backupSheet(){
  openSheet(`<h3>${T.backupTitle}</h3>
    <div class="small muted" style="margin-bottom:12px">${T.backupDesc}</div>
    <button class="btn" id="bex">${T.exportBtn}</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="bim">${T.importBtn}</button>
    <input type="file" id="bfile" accept="application/json,.json" style="display:none">
    <div style="height:12px"></div>
    <div class="small muted">${T.backupCount(archive().length, roster().length)}</div>`);
  $('#bex').onclick=doExport;
  $('#bim').onclick=()=>$('#bfile').click();
  $('#bfile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      /* Le fichier est entierement valide avant la moindre ecriture : un
         refus doit laisser l'historique exactement dans l'etat ou il etait. */
      let d=null;
      try{ d=JSON.parse(rd.result); }catch(err){ toast(T.badFile); return; }
      const ok=readBackup(d);
      if(!ok){ toast(T.badFile); return; }
      if(ok.bad){ toast(T.badGames(ok.bad)); return; }
      importChoice(ok);
    };
    rd.readAsText(f);
  };
}
/* Fusionner ou remplacer, deux boutons nommés plutôt qu'un confirm() où
   Annuler valait détruire. La touche d'échappement, le voile et le geste de
   retour ferment la feuille sans rien changer, ce qui est le seul
   comportement acceptable pour un geste d'abandon. */
function importChoice(ok){
  openSheet(`<h3>${T.importTitle}</h3>
    <div class="small muted" style="margin-bottom:14px">${T.importDesc(ok.archive.length, ok.roster.length)}</div>
    <button class="btn" id="imMerge">${T.importMerge}</button>
    <div style="height:8px"></div>
    <button class="btn danger" id="imReplace">${T.importReplace}</button>
    <div style="height:8px"></div>
    <button class="btn ghost sm" id="imCancel">${T.cancel}</button>`);
  $('#imCancel').onclick=closeSheet;
  $('#imMerge').onclick=()=>applyBackup(ok, true);
  $('#imReplace').onclick=()=>applyBackup(ok, false);
}
function applyBackup(ok, merge){
  if(merge){
    const a=archive(), ids=new Set(a.map(x=>x.id));
    ok.archive.forEach(g=>{ if(!ids.has(g.id)) a.push(g); });
    saveArchive(a);
    const r=roster(), rid=new Set(r.map(x=>x.id));
    ok.roster.forEach(p=>{ if(p && !rid.has(p.id)) r.push(p); });
    saveRoster(r);
  } else { saveArchive(ok.archive); saveRoster(ok.roster); }
  /* Les préférences suivent l'historique. En remplacement, on adopte celles
     du fichier ; en fusion, on ne pietine pas celles de l'appareil, sauf
     quand il n'en a pas encore, cas d'une restauration sur stockage vide. */
  const vierge = !Store.get('sk_cfg', null);
  if(ok.cfg && (!merge || vierge)) Store.set('sk_cfg', safeCfg(ok.cfg));
  if(ok.lang && I18N[ok.lang] && (!merge || !Store.get('sk_lang', null))) setLang(ok.lang, true);
  /* Le fichier qui vient d'etre lu fait office de sauvegarde a jour : inutile
     de reclamer un export dans la foulee. */
  Store.set('sk_exported_count', archive().length);
  Store.set('sk_backup_snooze', 0);
  draft = null;
  closeSheet(); buzz(20); toast(T.restored); goRoot('hof');
}

/* Demande au navigateur de ne pas évincer les données de l'app */
async function askPersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if(!already) await navigator.storage.persist();
    }
  }catch(e){}
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
/* Nombre de parties archivées depuis le dernier export */
function unsavedGames(){ return Math.max(0, archive().length - Store.get('sk_exported_count', 0)); }

    <div class="small" style="color:var(--warn);margin-bottom:10px">${T.backupDue(n)}</div>
    <div class="row" style="gap:8px">
      <button class="btn ghost sm grow" id="bkNow">${T.exportNow}</button>
      <button class="btn ghost sm grow" id="bkLater">${T.later}</button>
    </div></div>`);
  node.appendChild(el);
  $('#bkNow').onclick=()=>{ doExport(); render(); };
  $('#bkLater').onclick=()=>{ Store.set('sk_backup_snooze', Date.now()+7*864e5); render(); };
}
function installBanner(node){
  if(isStandalone() || Store.get('sk_install_hidden', false)) return;
  const el=h(`<div class="card" style="border-color:rgba(224,181,103,.35)">
    <div class="nm" style="margin-bottom:4px">${T.installTitle}</div>
    <div class="small muted" style="margin-bottom:10px">${isIOS()?T.installIOS:T.installAndroid}</div>
    <button class="btn ghost sm" id="inHide">${T.dismiss}</button></div>`);
  node.appendChild(el);
  $('#inHide').onclick=()=>{ Store.set('sk_install_hidden', true); render(); };
}

function doExport(){
  const data={v:1, exported:Date.now(), roster:roster(), archive:archive(), cfg:Store.get('sk_cfg',{}), lang:LANG};
  const txt=JSON.stringify(data);
  const blob=new Blob([txt],{type:'application/json'});
  const name='skull-king-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
  /* Sur Android et iOS, c'est le chemin de partage qui sert. L'ancien code
     y sortait avant d'avoir note la sauvegarde : la banniere de rappel
     revenait indefiniment et rien ne confirmait l'export au joueur. */
  const note=()=>{
    Store.set('sk_exported_count', archive().length);
    Store.set('sk_backup_snooze', 0);
    toast(T.exported);
    if(view==='hof') render();
  };
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      /* Un partage abandonne rejette : la sauvegarde n'est alors pas notee. */
      Promise.resolve(navigator.share({files:[file], title:name})).then(note, ()=>{});
      return;
    }
  }catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  note();
}

/* ===== En-tête & démarrage =========================================== */
$('#hHelp').onclick=()=>{ if(view!=='help') go('help'); else goBack(); };
$('#hBack').onclick=goBack;
$('#hMenu').onclick=()=>{
  openSheet(`<h3>${T.menu}</h3><div style="height:10px"></div>
    ${G?'<button class="btn ghost" id="mScores">'+T.mScores+'</button><div style="height:8px"></div>':''}
    ${G?'<button class="btn ghost" id="mRules">'+T.mRules+'</button><div style="height:8px"></div>':''}
    <button class="btn ghost" id="mHof">${T.mHof}</button><div style="height:8px"></div>
    <button class="btn ghost" id="mRoster">${T.mRoster}</button><div style="height:8px"></div>
    <button class="btn ghost" id="mHelp">${T.mHelp}</button><div style="height:8px"></div>
    <button class="btn ghost" id="mLang">${T.mLang}</button><div style="height:8px"></div>
    ${G?'<button class="btn ghost" id="mShare">'+T.mShare+'</button><div style="height:8px"></div>':''}
    <button class="btn danger" id="mNew">${T.mNew}</button>`);
  const b=id=>document.getElementById(id);
  b('mHelp').onclick=()=>{closeSheet(); go('help');};
  b('mHof').onclick=()=>{closeSheet(); go('hof');};
  b('mRoster').onclick=()=>{closeSheet(); go('roster');};
  b('mLang').onclick=()=>{ closeSheet(); setTimeout(langSheet, 240); };
  if(G){
    b('mScores').onclick=()=>{closeSheet(); goRoot('scores');};
    b('mRules').onclick=()=>{ closeSheet(); setTimeout(rulesSheet, 240); };
    b('mShare').onclick=()=>{closeSheet(); shareResult();};
  }
  b('mNew').onclick=()=>{ if(confirm(T.confirmAbandon)){ closeSheet(); Store.del('sk_game'); G=null; draft=newDraft(); goRoot('setup'); } };
};
/* Seule la courbe depend de la largeur de la fenetre. Un rendu complet
   ramenait en haut de page a chaque redimensionnement, et sur mobile le
   repli de la barre d'URL en declenche un a chaque defilement : l'ecran le
   plus long de l'application redebobinait sous les doigts du joueur. */
let resizeT;
window.addEventListener('resize',()=>{
  if(view!=='scores' || !G) return;
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    const node=$('#chart');
    if(node) try{ drawChart(node, standings(G), G); }catch(e){}
  }, 120);
});

setLang(detectLang());
askPersist();
/* Service worker : hors-ligne complet et mises à jour automatiques.
   Ignoré quand le fichier est ouvert en local (protocole file:). */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
load();
/* Une manche deja verrouillee n'est pas un ecran de saisie : apres une
   validation, un rechargement doit retomber sur les scores, pas rouvrir la
   manche qui vient d'etre comptee. */
if(G) view = (G.rounds.every(r=>r.locked) || (G.rounds[G.cur] && G.rounds[G.cur].locked))
  ? 'scores' : 'round';
else { draft=newDraft(); view='setup'; }
render();
/* ===== Actions globales ============================================== */
/* Isolé du partage lui-même pour être vérifiable sans navigator.share. */
function shareText(){
  const st=standings(G), rk=ranks(st.tot);
  let txt='☠ Skull King, '+fdate(Date.now())+'\n';
  st.tot.forEach((t,i)=>{ txt+=`${rk[i]}. ${t.p.name} : ${t.total} pts\n`; });
  return txt;
}
function shareResult(){
  const txt=shareText();
  if(navigator.share) navigator.share({text:txt}).catch(()=>{});
  else { navigator.clipboard && navigator.clipboard.writeText(txt); toast(T.copied); }
}
</script>
