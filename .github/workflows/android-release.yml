name: Android (Google Play)

# Construit l'AAB signe avec la cle d'upload et l'envoie sur la piste choisie
# de Google Play. Sans secret PLAY_SERVICE_ACCOUNT_JSON, le workflow s'arrete
# apres la construction et publie l'AAB en artefact : c'est le mode "a blanc".

on:
  workflow_dispatch:
    inputs:
      track:
        description: Piste Google Play
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: Etat de la version (draft tant que la fiche n'est pas complete)
        type: choice
        default: draft
        options: [draft, completed]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Synchroniser les assets web dans le projet Android
        working-directory: mobile
        run: |
          npm ci
          npm run sync:android

      - name: Installer la cle d'upload
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "secret ANDROID_KEYSTORE_BASE64 absent"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Construire l'AAB release (versionCode ${{ github.run_number }})
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/

      - name: Verifier la signature
        working-directory: mobile/android
        run: jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}.aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publier sur Google Play
        if: env.PLAY_JSON != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.thinkr.skullkingscore
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'draft' }}
          whatsNewDirectory: store/whatsnew

      - name: Sans compte de service
        if: env.PLAY_JSON == ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "PLAY_SERVICE_ACCOUNT_JSON absent : AAB construit et signe, non publie (artefact disponible)."
