name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe de l'application
        # `node --check <(...)` echoue : node resout /dev/fd/63 en
        # /proc/<pid>/fd/pipe:[...] et readFileSync renvoie ENOENT. Meme
        # controle, via un vrai fichier.
        run: |
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > "${RUNNER_TEMP}/app-block.js"
          node --check "${RUNNER_TEMP}/app-block.js"

      - name: Horodater la version du service worker
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          sed -i "s/const VERSION = 'sk-v1';/const VERSION = 'sk-${STAMP}';/" sw.js
          echo "Version du cache : sk-${STAMP}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
